name: Validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    name: Check all files with pre-commit
    timeout-minutes: 30
    steps:
      - name: Checkout code so that it is available to use in the executing runner
        uses: actions/checkout@v4.1.4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check all files with pre-commit
        run: |
          pre_commit_version="$(awk '$1 == "pre-commit" { print $2 }' .tool-versions)"
          uvx --from "pre-commit==$pre_commit_version" pre-commit run --all-files

  nix-evaluation:
    runs-on: ubuntu-latest
    name: Evaluate ${{ matrix.host }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host:
          - macbook-pro-m1
          - macbook-pro-m4
          - macbook-pro-m4-together
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Evaluate nix-darwin configuration
        run: nix eval ".#darwinConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath" --raw --show-trace
